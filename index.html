<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Resep Makanan Sederhana</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🍽️ Resep Makanan Mudah</h1>
        <p>Cepat • Praktis • Enak</p>
    </header>

    <main>
        <div class="resep">
            <h2>Nasi Goreng</h2>
            <button onclick="tampilkanResep()">Lihat Resep</button>

            <div id="detail-resep" class="hidden">
                <h3>Bahan:</h3>
                <ul>
                    <li>Nasi putih</li>
                    <li>Telur</li>
                    <li>Bawang putih</li>
                    <li>Kecap</li>
                </ul>

                <h3>Cara Membuat:</h3>
                <ol>
                    <li>Tumis bawang</li>
                    <li>Masukkan telur</li>
                    <li>Masukkan nasi & kecap</li>
                    <li>Aduk hingga matang</li>
                </ol>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
